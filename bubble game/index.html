<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Game Revision</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="panel">
                <div class="panel-top">
                    <div class="elem-box">
                        <div class="elem">
                            <h2>Hit</h2>
                            <div class="box" id="hitval">0</div>
                        </div>
                        <div class="elem">
                            <h2>Timer</h2>
                            <div class="box" id="timerval">60</div>
                        </div>
                        <div class="elem">
                            <h2>Score</h2>
                            <div class="box" id="scoreval">0</div>
                        </div>
                    </div>
                </div>
                <div class="panel-bottom">
                    <!-- <div class="bubble">1</div> -->
                </div>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
