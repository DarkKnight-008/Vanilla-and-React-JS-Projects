<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>love babber</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width: 100vw;
        }
        .grid-container{
            min-height: 100%;
            width: 100%;
            background-color: rgb(21, 21, 21);
            display: grid;
            row-gap: 1rem;
            column-gap: 1rem;

            grid-template-rows: 1fr 1fr 1fr 1fr;
            grid-template-columns: 1fr 1fr 1fr;
        }
        .items{
            background-color: rgb(49, 49, 108);
            border: 2px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        #header{
            grid-column-start:1 ;
            grid-column-end: 4;
        }
        #footer{
            grid-column-start:1;
            grid-column-end: 4;
        }
        #sidebar{
            grid-row-start:2 ;
            grid-row-end:4 ;
        }
        #content-1{
            grid-column-start:2 ;
            grid-column-end: 4 ;
        }

        @media(max-width:767px){
        .grid-container{
            grid-template-rows:  1fr 1fr 1fr 1fr 1fr 1fr;
            grid-template-columns: 1fr;

        }

        #header,
        #sidebar,
        #content-1,
        #content-2,
        #content-3,
        #footer{
            grid-column: auto;
            grid-row: auto;
        }

        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="items" id="header">header</div>
        <div class="items" id="sidebar">sidebar</div>
        <div class="items" id="content-1">content-1</div>
        <div class="items" id="content-2">content-2</div>
        <div class="items" id="content-3">content-3</div>
        <div class="items" id="footer">footer</div>
    </div>
</body>
</html>
