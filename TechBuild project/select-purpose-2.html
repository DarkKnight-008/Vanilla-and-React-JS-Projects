<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
      <!-- tailwind css cdn link  and fonts link -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap');
    </style>
    <link rel="stylesheet" href="fonts.css">

    <!-- linking remix-icon cdn  -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- linking the css file : first.css  -->
    <link rel="stylesheet" href="css/first.css">

  <link rel="stylesheet" href="./css/select-purpose-2.css">
</head>
<body>

      <header>
        <div class="header-container">
            <div class="inner-container-1">
                <a href="#" class="logo-container">
                    <div class="logo-img-container">
                        <img src="./images/select-purpose-2-images/logo.png" alt="logo">
                    </div>
                    <h2>TechBuild</h2>
                </a>
                    
            </div>
            <div class="inner-container-2">
                <input type="text" name="" id="" placeholder="Search for CPUs, GPUs, or Components">
                <button><i class="ri-search-line"></i></button>
            </div>
            <div class="inner-container-3">
                <button>
                  <div class="inner-btn-cont-1">
                    <img src="./images/select-purpose-2-images/screw-driver.png" alt="">
                  </div>
                  <div class="inner-btn-cont-2">
                    <span>Build Your PC</span>
                  </div>
                </button>
                <i class="ri-shopping-cart-2-line header-icon"></i>
                <i class="ri-user-line header-icon"></i>
            </div>

        </div>
    </header>

<!-- breadcrumber  -->
  <nav class="breadcrumbercontainer" aria-label="Breadcrumb">
    <a href="first.html">Home</a>
    <span class="breadcrumb-sep">/</span>

    <a href="/select-purpose-1.html">Custom PC</a>
    <span class="breadcrumb-sep">/</span>

    <span aria-current="page">Gaming PC</span>
</nav>


<main>
  <section class="pc-config-section">
    <div class="pc-config-container">
        
      <!-- 1st component  -->
      <div class="component-container">
          <div class="component-img-container">
            <img src="./images/select-purpose-2-images/processor-thumbnail-img.png" alt="">
            <div class="icon-btn-container">
              <div class="icon-container">
                <i class="ri-cpu-line"></i>
                <p>Processor</p>
              </div>
              <div class="btn-container">
                <button>Next</button>
              </div>
            </div>
          </div>
      </div>
      <!-- 2nd component  -->
      <div class="component-container">
          <div class="component-img-container">
            <img src="./images/select-purpose-2-images/cabinet-thumbnail-img.png" alt="">
            <div class="icon-btn-container">
              <div class="icon-container">
                <i class="ri-cpu-line"></i>
                <p>cabinet/case</p>
              </div>
              <div class="btn-container">
                <button>Next</button>
              </div>
            </div>
          </div>
      </div>
      <!-- 3rd component  -->
      <div class="component-container">
          <div class="component-img-container">
            <img src="./images/select-purpose-2-images/memory-thumbnail-img.png" alt="">
            <div class="icon-btn-container">
              <div class="icon-container">
                <i class="ri-cpu-line"></i>
                <p>memory</p>
              </div>
              <div class="btn-container">
                <button>Next</button>
              </div>
            </div>
          </div>
      </div>
      <!-- 4th component  -->
      <div class="component-container">
          <div class="component-img-container">
            <img src="./images/select-purpose-2-images/graphiccard-thumbnail-img.png" alt="">
            <div class="icon-btn-container">
              <div class="icon-container">
                <i class="ri-cpu-line"></i>
                <p>grahics card</p>
              </div>
              <div class="btn-container">
                <button>Next</button>
              </div>
            </div>
          </div>
      </div>
      <!-- 5th component  -->
      <div class="component-container">
        <div class="component-img-container">
            <img src="./images/select-purpose-2-images/storage-thumbnail-img.png" alt="">
            <div class="icon-btn-container">
              <div class="icon-container">
                <i class="ri-cpu-line"></i>
                <p>storage</p>
              </div>
              <div class="btn-container">
                <button>Next</button>
              </div>
            </div>
          </div>
        </div>
        
      <!-- 6th component  -->
      <div class="component-container">
          <div class="component-img-container">
            <img src="./images/select-purpose-2-images/motherboard-thumbnail-img.png" alt="">
            <div class="icon-btn-container">
              <div class="icon-container">
                <i class="ri-cpu-line"></i>
                <p>motherboard</p>
              </div>
              <div class="btn-container">
                <button>Next</button>
              </div>
            </div>
          </div>
      </div>
    
      </div>
  </section>
  
</main>

</html>
